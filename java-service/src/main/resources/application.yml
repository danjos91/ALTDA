server:
  port: 8000

spring:
  application:
    name: altda-java-service
  threads:
    virtual:
      enabled: true
  web:
    resources:
      static-locations: classpath:/static/

altda:
  go:
    # mock (default) | http
    client: mock
    base-url: http://localhost:8081
    connect-timeout-ms: 5000
    # Per-call read timeouts (Go LLM skills vs fast deterministic steps)
    timeouts:
      # 3 variants at 2 concurrent × 110 s LLM calls + backoff ≈ under 300 s;
      # Go skeleton deadline is 280 s so it returns llm_timeout before Java fires.
      skeleton-ms: 300000      # /v1/skeleton/generate ~5 min
      regenerate-ms: 300000    # /v1/skeleton/regenerate ~5 min
      # 12 modules at 2 concurrent × 110 s ≈ 660 s + retries; Go deadline 870 s.
      content-ms: 900000       # /v1/content ~15 min
      validate-ms: 10000       # /v1/validate ~10 s
      allocate-ms: 10000       # /v1/allocate (if present) ~10 s
      parse-ms: 60000          # /v1/parse ~1 min

logging:
  level:
    ru.acr.altda: INFO
